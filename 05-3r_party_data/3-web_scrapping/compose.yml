services:
  
  postgres_pgvector:
    image: pgvector/pgvector:0.7.4-pg16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./databases:/docker-entrypoint-initdb.d

  nginx:
    image: nginx:alpine
    ports:
      - "3012:80"
    volumes:
      - ./codely:/usr/share/nginx/html
